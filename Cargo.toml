[package]
name = "ecriture-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", features = ["serde", "glow"] }
egui = { version = "0.37", features = ["serde"] }
candle-core = "0.11"
image = "0.25"
anyhow = "1.0"
evdev = "0.13.2"
candle-nn = "0.11.1"
pthrs = "1.0.0"
hf-hub = { version = "1.0.0", features = ["blocking"] }
reqwest = { version = "0.13", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
